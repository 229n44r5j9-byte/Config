<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>أحدث الكونفجات - شركات الاتصالات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#090d16;
  --cover-url:url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1600&q=85');
  --card:rgba(15,23,42,.74);
  --glass:rgba(255,255,255,.10);
  --p:#00f2fe;
  --s:#4facfe;
  --ver:#1d9bf0;
  --tx:#f8fafc;
  --mu:#cbd5e1;
  --ease:cubic-bezier(.22,1,.36,1)
}
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Cairo',sans-serif;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}
input,select,textarea{
  user-select:text;
  -webkit-user-select:text;
  font-size:16px !important;
}
html,body{
  width:100%;
  min-height:100vh;
  overflow-x:hidden;
  overscroll-behavior-x:none;
}
body{
  background-color:var(--bg);
  color:var(--tx);
  position:relative;
}
body.loading{overflow:hidden}

/* كفر خلفية الشاشة */
.screen-cover{
  position:fixed;
  inset:0;
  z-index:-2;
  background-image:var(--cover-url);
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
  transform:scale(1.03);
  filter:brightness(.52) contrast(1.08) saturate(1.15);
  pointer-events:none;
}
.screen-cover::after{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(to bottom, rgba(9,13,22,.65) 0%, rgba(9,13,22,.35) 50%, rgba(9,13,22,.85) 100%),
    radial-gradient(circle at 15% 20%, rgba(0,242,254,.14), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(79,172,254,.14), transparent 45%);
}

.bg-grid{
  position:fixed;
  inset:0;
  background-size:42px 42px;
  background-image:linear-gradient(to right,rgba(255,255,255,.025) 1px,transparent 1px),
                    linear-gradient(to bottom,rgba(255,255,255,.025) 1px,transparent 1px);
  z-index:-1;
  animation:gridMove 22s linear infinite;
  pointer-events:none;
}
@keyframes gridMove{to{transform:translateY(42px)}}

.container{
  max-width:900px;
  margin:0 auto;
  padding:20px 16px 100px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* شاشة اللودينج */
#splash{
  position:fixed;
  inset:0;
  z-index:5000;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  transition:opacity .6s ease,transform .8s var(--ease),clip-path .8s var(--ease);
  clip-path:inset(0 0 0 0);
}
#splash.hide{opacity:0;clip-path:inset(0 0 100% 0);pointer-events:none}
.sig{display:flex;align-items:flex-end;gap:7px;height:70px}
.sig i{width:12px;border-radius:6px;background:linear-gradient(to top,var(--s),var(--p));animation:bar 1.1s ease-in-out infinite;box-shadow:0 0 18px rgba(0,242,254,.5)}
.sig i:nth-child(1){height:20%}.sig i:nth-child(2){height:40%;animation-delay:.12s}.sig i:nth-child(3){height:60%;animation-delay:.24s}.sig i:nth-child(4){height:80%;animation-delay:.36s}.sig i:nth-child(5){height:100%;animation-delay:.48s}
@keyframes bar{0%,100%{transform:scaleY(.35);opacity:.45}50%{transform:scaleY(1);opacity:1}}
.splash-t{font-size:1.5rem;font-weight:900;background:linear-gradient(135deg,#fff 30%,var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.splash-bar{width:200px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.splash-bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--s),var(--p));transition:width .4s ease}
.splash-s{color:var(--mu);font-size:.85rem;min-height:1.3em}

header{
  text-align:center;
  padding:35px 20px;
  background:var(--card);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--glass);
  border-radius:24px;
  margin-bottom:20px;
  box-shadow:0 20px 45px rgba(0,0,0,.45);
  position:relative;
  overflow:hidden;
  transform-origin:top center;
}
body:not(.loading) header{animation:curtainDrop .9s var(--ease) .15s backwards}
header::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--p),transparent);animation:scan 3s infinite}
@keyframes scan{to{left:100%}}
.site-title{font-size:1.75rem;font-weight:900;background:linear-gradient(135deg,#fff 30%,var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.dev-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,.08);
  padding:7px 20px;
  border-radius:50px;
  border:1px solid rgba(255,255,255,.14);
  font-weight:800;
  font-size:1.08rem;
  margin-bottom:18px;
  cursor:pointer;
  transition:.25s;
}
.dev-badge:active{transform:scale(.96)}
.verified-icon{color:var(--ver);font-size:1.18rem;filter:drop-shadow(0 0 8px rgba(29,155,240,.65));animation:pv 2s infinite}
@keyframes pv{0%,100%{transform:scale(1)}50%{transform:scale(1.18) rotate(8deg)}}
.header-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.tg-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#229ED9,#1b7fb0);color:#fff;text-decoration:none;padding:10px 24px;border-radius:14px;font-weight:700;font-size:.95rem;transition:.3s;box-shadow:0 8px 20px rgba(34,158,217,.3);border:0;cursor:pointer;position:relative;overflow:hidden}
.tg-btn:hover{transform:translateY(-3px);box-shadow:0 12px 25px rgba(34,158,217,.5)}
.tg-btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3.5s infinite}
@keyframes shine{60%,100%{left:130%}}
.stats{display:flex;justify-content:center;gap:22px;margin-top:20px;color:var(--mu);font-size:.85rem}
.stats b{color:var(--p);font-size:1.15rem;margin-inline-end:4px}

.search{position:relative;margin-bottom:14px}
.search input{width:100%;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass);color:#fff;padding:12px 44px 12px 14px;border-radius:14px;outline:none;transition:.3s}
.search input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(0,242,254,.12)}
.search i{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--mu)}
.filters{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-bottom:16px;scrollbar-width:none}
.filter-btn{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass);color:var(--mu);padding:8px 18px;border-radius:12px;cursor:pointer;font-weight:700;white-space:nowrap;transition:all .35s var(--ease)}
.filter-btn.active,.filter-btn:hover{background:linear-gradient(135deg,var(--s),var(--p));color:#090d16;border-color:transparent;box-shadow:0 5px 15px rgba(0,242,254,.25);transform:translateY(-2px)}

.files-wrapper{perspective:1200px;position:relative}
.files-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;transform-origin:top center;transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .3s}
.files-grid.curtain-closing{opacity:0;transform:rotateX(-22deg) scaleY(.88) translateY(-12px);clip-path:inset(0 0 35% 0)}
.files-grid.curtain-opening{animation:unfold .55s var(--ease) forwards}
@keyframes unfold{0%{opacity:0;transform:rotateX(-25deg) scaleY(.85) translateY(-15px);clip-path:inset(0 0 100% 0)}60%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
@keyframes curtainDrop{0%{opacity:0;transform:perspective(1000px) rotateX(-20deg) translateY(-20px);clip-path:inset(0 0 100% 0)}100%{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
.file-card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass);border-radius:20px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;transform-origin:top center;animation:sheet .5s var(--ease) backwards;position:relative;overflow:hidden}
@keyframes sheet{from{opacity:0;transform:perspective(800px) rotateX(-18deg) translateY(-14px)}to{opacity:1;transform:none}}
.file-card::before{content:'';position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(0,242,254,.12),transparent 60%);opacity:0;transition:.3s;pointer-events:none}
.file-card:hover{transform:translateY(-5px);border-color:rgba(0,242,254,.35);box-shadow:0 15px 30px rgba(0,0,0,.45)}
.file-card:hover::before{opacity:1}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.net-tag{padding:4px 12px;border-radius:8px;font-size:.8rem;font-weight:800}
.net-vodafone{background:rgba(230,0,0,.22);color:#ff5c5c;border:1px solid rgba(230,0,0,.35)}
.net-orange{background:rgba(255,121,0,.22);color:#ffb366;border:1px solid rgba(255,121,0,.35)}
.net-etisalat{background:rgba(113,188,66,.22);color:#a7eb7b;border:1px solid rgba(113,188,66,.35)}
.net-we{background:rgba(112,34,131,.28);color:#df99ff;border:1px solid rgba(112,34,131,.45)}
.net-all{background:rgba(0,242,254,.16);color:var(--p);border:1px solid rgba(0,242,254,.35)}
.file-ext{font-size:.75rem;color:var(--mu);background:rgba(255,255,255,.07);padding:3px 8px;border-radius:6px;direction:ltr}
.file-title{font-size:1.15rem;font-weight:700;margin-bottom:6px;color:#fff}
.file-desc{font-size:.88rem;color:var(--mu);line-height:1.5;margin-bottom:16px}
.card-footer{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--glass);gap:10px}
.file-date{font-size:.78rem;color:var(--mu)}
.dl-btn{background:linear-gradient(135deg,var(--s),var(--p));color:#090d16;border:none;padding:8px 16px;border-radius:10px;font-weight:800;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.25s}
.dl-btn:hover{transform:scale(1.06);box-shadow:0 5px 15px rgba(0,242,254,.4)}
.dl-btn:active{transform:scale(.95)}
.del-btn{background:rgba(239,68,68,.2);color:#f87171;border:1px solid rgba(239,68,68,.3);padding:8px 10px;border-radius:10px;cursor:pointer;display:none}
body.is-admin .del-btn{display:inline-block}
.skel{height:170px;border-radius:20px;background:linear-gradient(100deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.11) 50%,rgba(255,255,255,.05) 70%);background-size:300% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-300% 0}}
.loader{text-align:center;padding:40px;color:var(--p);font-weight:700;grid-column:1/-1}

/* فوتر ثابت ظاهر على طول */
.dev-footer-fixed{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:850;
  text-align:center;
  padding:8px 14px calc(8px + env(safe-area-inset-bottom));
  background:rgba(9,13,22,.82);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--glass);
  color:var(--mu);
  font-size:.82rem;
  font-weight:700;
  pointer-events:none;
}
.dev-footer-fixed .fv{color:var(--ver);margin-inline-start:5px}

#toast{position:fixed;bottom:92px;left:50%;transform:translate(-50%,30px);background:#111827;border:1px solid rgba(0,242,254,.3);padding:10px 20px;border-radius:14px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:.4s var(--ease);z-index:3000}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toTop{position:fixed;bottom:44px;left:18px;width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--glass);color:var(--p);cursor:pointer;opacity:0;transform:scale(.6);transition:.3s var(--ease);z-index:900;backdrop-filter:blur(8px)}
#toTop.show{opacity:1;transform:none}

#chatFab{position:fixed;bottom:44px;right:18px;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--s),var(--p));color:#090d16;font-size:1.35rem;cursor:pointer;z-index:1200;box-shadow:0 10px 25px rgba(0,242,254,.35);transition:.3s var(--ease)}
#chatFab:hover{transform:scale(1.1) rotate(-6deg)}
#chatFab::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--p);animation:ring 2.2s infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.6);opacity:0}}
#chatPanel{position:fixed;bottom:112px;right:14px;width:min(380px,calc(100vw - 28px));height:min(520px,calc(100vh - 150px));background:#0f1626;border:1px solid rgba(0,242,254,.25);border-radius:22px;z-index:1200;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 25px 50px rgba(0,0,0,.6);transform-origin:bottom right;transform:scale(.6) translateY(30px);opacity:0;pointer-events:none;transition:.4s var(--ease)}
#chatPanel.open{transform:none;opacity:1;pointer-events:auto}
.ch-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--glass);font-weight:800}
.ch-head button{background:none;border:0;color:var(--mu);font-size:1.1rem;cursor:pointer}
.ch-gate{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:22px;text-align:center}
.ch-gate .ic{font-size:2.4rem;color:#229ED9;animation:pv 2.4s infinite}
.ch-gate p{color:var(--mu);font-size:.9rem;line-height:1.6}
.form-control{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--glass);color:#fff;padding:10px 14px;border-radius:12px;outline:none}
.form-control:focus{border-color:var(--p)}
.ch-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}

/* رسائل الشات واختلاف اليوزرات + ستايل أحمد الموثق الخاص */
.msg{
  max-width:85%;
  padding:9px 13px;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.05);
  animation:pop .3s var(--ease);
  word-break:break-word;
}
.msg.me{
  align-self:flex-start;
  background:linear-gradient(135deg,rgba(79,172,254,.28),rgba(0,242,254,.18));
  border-color:rgba(0,242,254,.25);
}
.msg.admin-msg{
  align-self:stretch;
  max-width:100%;
  background:linear-gradient(135deg,rgba(29,155,240,.22),rgba(0,242,254,.14),rgba(139,92,246,.16));
  border:1px solid rgba(29,155,240,.55);
  box-shadow:0 8px 24px rgba(29,155,240,.18);
}
.msg small{display:flex;align-items:center;gap:5px;font-weight:800;font-size:.76rem;margin-bottom:3px}
.msg .adm-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  background:rgba(29,155,240,.2);
  color:#7dd3fc;
  padding:1px 7px;
  border-radius:50px;
  font-size:.68rem;
  border:1px solid rgba(29,155,240,.4);
}
.msg .adm{color:var(--ver);filter:drop-shadow(0 0 6px rgba(29,155,240,.8))}
.msg p{font-size:.93rem;line-height:1.55}
.msg.admin-msg p{
  font-weight:700;
  color:#f0f9ff;
  letter-spacing:.2px;
}

@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.95)}}
.ch-send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--glass)}
.ch-send button{background:linear-gradient(135deg,var(--s),var(--p));border:0;border-radius:12px;width:44px;color:#090d16;cursor:pointer;font-size:1rem}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);display:none;justify-content:center;align-items:center;padding:16px;z-index:2000;perspective:1200px}
.modal-box{background:#111827;border:1px solid rgba(0,242,254,.25);border-radius:24px;padding:24px;width:100%;max-width:460px;box-shadow:0 25px 50px rgba(0,0,0,.7);transform-origin:top center;animation:unfold .45s var(--ease) forwards}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.close-modal{background:none;border:none;color:var(--mu);font-size:1.3rem;cursor:pointer}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.88rem;color:var(--mu);margin-bottom:6px}
.submit-btn{width:100%;background:linear-gradient(135deg,var(--s),var(--p));color:#090d16;border:none;padding:12px;border-radius:12px;font-weight:800;font-size:1rem;cursor:pointer;margin-top:8px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* عداد الزوار في لوحة الأدمن */
.vis-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(0,242,254,.07);border:1px solid rgba(0,242,254,.25);border-radius:16px;padding:12px 16px;margin-bottom:16px}
.vis-card .vl{display:flex;align-items:center;gap:8px;color:var(--mu);font-weight:700;font-size:.92rem}
.vis-card .vl i{color:var(--p)}
.vis-card b{font-size:1.5rem;font-weight:900;color:#fff;min-width:48px;text-align:center}
.vis-card button{background:rgba(255,255,255,.08);border:1px solid var(--glass);color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer}
.vis-card button:active{transform:scale(.92)}
</style>
</head>

<script>
(function(){
  /* إعدادات الشات والكفر */

  // منع الزوم نهائياً على آيفون وأندرويد (Pinch + Double Tap)

    if (e.touches.length > 1) { e.preventDefault(); return; }

    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;

  document.addEventListener('keydown', function(e){
    if (e.ctrlKey && e.shiftKey && (e.key==='A'||e.key==='a')) { e.preventDefault(); openAdminModal(); return; }

  });

  // الإعدادات المحمية
  const _0x1a = atob("aHR0cHM6Ly9lbHNobzNsLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbS9jb25maWdz");
  const _0x2b = atob("OTYxMzA=");
  const _0x3c = atob("QUhNRURfOTYxMzBfU0VDVVJF");
  const DB_ROOT = _0x1a.replace(/\/configs$/, '');

  const COVER_DB_URL = DB_ROOT + '/siteCover';

  let allFiles = [], currentFilter = 'all', searchTerm = '';
  const $ = id => document.getElementById(id);

  function applyCoverImage(src){
    if (!src) return;

  window.updateScreenCover = function(input){
    if (!document.body.classList.contains('is-admin') || !input.files[0]) return;
    const f = input.files[0];
    if (f.size > 1.5 * 1024 * 1024) { alert('حجم الصورة كبير، اختر صورة أقل من 1.5 ميجا.'); return; }
    const reader = new FileReader();
    reader.onload = async function(e){
      const dataUrl = e.target.result;
      applyCoverImage(dataUrl);
      try {
        await fetch(`${COVER_DB_URL}.json`, {
          method: 'PUT',
          body: JSON.stringify({ url: dataUrl, authKey: _0x3c })

        toast('تم تحديث كفر الشاشة ✓');

  function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2400); }
  function escapeHTML(str){ return String(str||'').replace(/[&<>'"]/g, t=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t])); }
  function animateNum(el, to){ let n=0; const step=Math.max(1,Math.ceil(to/25)); const i=setInterval(()=>{ n=Math.min(to,n+step); el.textContent=n; if(n>=to)clearInterval(i); },30); }

  const msgs = ['جاري تجهيز الموقع...','بنجيب أحدث الكونفجات...','لحظات وهتبقى جاهز...'];
  let mi = 0; const msgT = setInterval(()=>{ mi=(mi+1)%msgs.length; $('splashMsg').textContent=msgs[mi]; },900);
  $('splashBar').style.width='30%';
  function hideSplash(){
    $('splashBar').style.width='100%';
    setTimeout(()=>{ clearInterval(msgT); $('splash').classList.add('hide'); document.body.classList.remove('loading'); setTimeout(()=>$('splash').remove(),900); },350);
  }

  // فتح لوحة الأدمن: 5 ضغطات متتالية أو ضغطة طويلة على شارة أحمد الموثقة
  let tapCount = 0, tapTimer = null, longPressTimer = null, longPressTriggered = false;
  const adminTrigger = $('secretAdminTrigger');

  function triggerAdminTap(){
    if (longPressTriggered) { longPressTriggered = false; return; }
    tapCount++;
    clearTimeout(tapTimer);
    if (tapCount >= 5){
      tapCount = 0;
      openAdminModal();
    } else {
      tapTimer = setTimeout(() => { tapCount = 0; }, 1600);
    }
  }

  adminTrigger.addEventListener('pointerdown', () => {
    longPressTriggered = false;
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(() => {
      longPressTriggered = true;
      tapCount = 0;
      openAdminModal();
    }, 1200);
  });

  adminTrigger.addEventListener('pointerup', () => {
    clearTimeout(longPressTimer);
  });

  adminTrigger.addEventListener('pointercancel', () => {
    clearTimeout(longPressTimer);
  });

  adminTrigger.addEventListener('click', triggerAdminTap);

  window.loadFiles = async function(first){
    const container = $('filesContainer'); const t0 = Date.now();
    loadCover();
    try {
      const res = await fetch(`${_0x1a}.json`);
      const data = await res.json();
      allFiles = [];
      if (data) { Object.keys(data).forEach(k=>allFiles.push({id:k,...data[k]})); allFiles.reverse(); }
      animateNum($('stCount'), allFiles.length);
      $('stNet').textContent = new Set(allFiles.map(f=>f.network).filter(n=>n&&n!=='all')).size;
      if (first) await new Promise(r=>setTimeout(r, Math.max(0, 1800-(Date.now()-t0))));
      renderFiles(true);
    } catch(err){
      container.innerHTML = `<div class="loader" style="color:#f87171;">حدث خطأ في الاتصال بقاعدة البيانات</div>`;
    }
    if (first) hideSplash();
  };

  function renderFiles(withCurtain){
    const container = $('filesContainer');
    const q = searchTerm.trim().toLowerCase();
    const filtered = allFiles.filter(f =>
      (currentFilter==='all' || f.network===currentFilter || f.network==='all') &&
      (!q || (f.title||'').toLowerCase().includes(q) || (f.desc||'').toLowerCase().includes(q)));
    const netNames = {
      vodafone:{label:'فودافون',cls:'net-vodafone'}, orange:{label:'أورنج',cls:'net-orange'},
      etisalat:{label:'اتصالات',cls:'net-etisalat'}, we:{label:'وي (WE)',cls:'net-we'}, all:{label:'الكل / سكريبت',cls:'net-all'}
    };
    if (!filtered.length) {
      container.innerHTML = `<div class="loader" style="color:var(--mu);">لا توجد ملفات متاحة في هذا القسم حالياً.</div>`;
    } else {
      container.innerHTML = filtered.map((file,idx)=>{
        const net = netNames[file.network] || netNames.all;
        const ext = file.fileName ? file.fileName.split('.').pop().toUpperCase() : 'FILE';
        return `
        <div class="file-card" style="animation-delay:${Math.min(idx,12)*0.06}s">
          <div>
            <div class="card-top"><span class="net-tag ${net.cls}">${net.label}</span><span class="file-ext">.${escapeHTML(ext)}</span></div>
            <h3 class="file-title">${escapeHTML(file.title)}</h3>
            <p class="file-desc">${escapeHTML(file.desc || 'جاهز للتحميل والتشغيل المباشر')}</p>
          </div>
          <div class="card-footer">
            <span class="file-date"><i class="far fa-clock"></i> ${escapeHTML(file.date || 'الآن')}</span>
            <div style="display:flex;gap:6px;">
              <button class="del-btn" data-id="${escapeHTML(file.id)}" onclick="deleteFile(this.dataset.id)" title="حذف الملف"><i class="fas fa-trash"></i></button>
              <button class="dl-btn" data-id="${escapeHTML(file.id)}" onclick="downloadFile(this.dataset.id)"><i class="fas fa-download"></i> تحميل</button>
            </div>
          </div>
        </div>`;
      }).join('');
    }
    if (withCurtain){
      container.classList.remove('curtain-closing','curtain-opening');
      void container.offsetWidth;
      container.classList.add('curtain-opening');
    }
  }

  $('filesContainer').addEventListener('pointermove', e=>{
    const c = e.target.closest('.file-card'); if(!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty('--mx',(e.clientX-r.left)+'px'); c.style.setProperty('--my',(e.clientY-r.top)+'px');
  });

  window.onSearch = function(v){ searchTerm=v; renderFiles(false); };

  window.filterFiles = function(net, btn){
    if (currentFilter===net) return;
    currentFilter = net;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const c = $('filesContainer');
    c.classList.remove('curtain-opening'); c.classList.add('curtain-closing');
    setTimeout(()=>renderFiles(true),260);
  };

  window.downloadFile = function(id){
    const file = allFiles.find(f=>f.id===id);
    if (!file || !file.fileData || !/^data:/.test(file.fileData)) return;
    const a = document.createElement('a');
    a.href = file.fileData; a.download = file.fileName || 'config_ahmed.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('بدأ التحميل ✓');
  };

  window.openAdminModal = function(){
    $('adminModal').style.display='flex';
    if (document.body.classList.contains('is-admin')){
      loadVisitors();
      $('loginSection').style.display='none'; $('uploadSection').style.display='block';
      $('modalTitle').innerText='رفع كونفج / سكريبت جديد';
    } else {
      $('adminPassInput').value='';
      setTimeout(()=>$('adminPassInput').focus(),120);
    }
  };
  window.closeAdminModal = ()=>{ $('adminModal').style.display='none'; };
  window.verifyAdmin = function(){
    if ($('adminPassInput').value === _0x2b){
      document.body.classList.add('is-admin');
      $('loginSection').style.display='none'; $('uploadSection').style.display='block';
      $('modalTitle').innerText='رفع كونفج / سكريبت جديد';
      toast('تم تفعيل وضع الأدمن ✓'); loadVisitors();
      if (chatUser) enterChat();
    } else alert('رمز الأمان غير صحيح!');
  };

  window.uploadFile = function(){
    if (!document.body.classList.contains('is-admin')) return;
    const title=$('fileTitle').value.trim(), network=$('fileNetwork').value, desc=$('fileDesc').value.trim();
    const fileInput=$('fileInput'), btn=$('uploadBtn');
    if (!title || !fileInput.files[0]) { alert('من فضلك اكتب عنوان الملف واختر الملف أولاً.'); return; }
    const file = fileInput.files[0];
    if (file.size > 2*1024*1024) { alert('حجم الملف كبير! يفضل يكون أقل من 2 ميجا.'); return; }
    btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> جاري الرفع...';
    const reader = new FileReader();
    reader.onload = async function(e){
      const payload = { title, network, desc, fileName:file.name, fileData:e.target.result, authKey:_0x3c,
        date:new Date().toLocaleDateString('ar-EG',{month:'short',day:'numeric'}) };
      try {
        const response = await fetch(`${_0x1a}.json`,{method:'POST',body:JSON.stringify(payload)});
        if (!response.ok) throw new Error('Permission denied');
        $('fileTitle').value=''; $('fileDesc').value=''; fileInput.value='';
        closeAdminModal(); loadFiles(); toast('تم نشر الملف ✓');
      } catch(err){ alert('فشل رفع الملف، تأكد من الاتصال بالإنترنت أو إعدادات الحماية.'); }
      finally { btn.disabled=false; btn.innerHTML='<i class="fas fa-cloud-upload-alt"></i> نشر الملف الآن'; }
    };
    reader.readAsDataURL(file);
  };

  window.deleteFile = async function(id){
    if (!document.body.classList.contains('is-admin')) return;
    if (!confirm('متأكد إنك عايز تمسح الملف ده؟')) return;
    await fetch(`${_0x1a}/${id}.json`,{method:'DELETE'});
    loadFiles();
  };

  /* ===== الشات وحماية اسم أحمد + تمييز كل يوزر ===== */
  let chatUser = null, chatTimer = null, lastSend = 0, lastCount = -1;
  try { chatUser = localStorage.getItem('tg_user'); } catch(e){}

  function isReservedAhmedName(name){
    const clean = String(name || '')
      .replace(/^@+/, '')
      .replace(/[\u064B-\u065F\u0670]/g, '')
      .replace(/[أإآا]/g, 'ا')
      .replace(/ى/g, 'ي')
      .replace(/ة/g, 'ه')
      .toLowerCase()
      .replace(/[^a-z0-9\u0621-\u064a]/g, '');
    return clean === 'احمد' || clean === 'ahmed' || clean.startsWith('احمدال') || clean === 'admin';
  }

  function userColor(name){
    const palette = ['#38bdf8','#f472b6','#34d399','#fbbf24','#a78bfa','#fb7185','#2dd4bf','#f97316'];
    let hash = 0;
    const s = String(name || 'user');
    for (let i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);
    return palette[Math.abs(hash) % palette.length];
  }

  window.toggleChat = function(){
    const p = $('chatPanel'); p.classList.toggle('open');
    if (p.classList.contains('open')) enterChat(); else { clearInterval(chatTimer); chatTimer=null; }
  };

  function enterChat(){
    const isAdminNow = document.body.classList.contains('is-admin');
    if (isAdminNow){
      chatUser = 'أحمد';
      try { localStorage.setItem('tg_user', chatUser); } catch(e){}
    } else if (chatUser && isReservedAhmedName(chatUser)){
      chatUser = null;
      try { localStorage.removeItem('tg_user'); } catch(e){}
    }

    const ok = !!chatUser;
    $('chGate').style.display = ok ? 'none' : 'flex';
    $('chRoom').style.display = ok ? 'flex' : 'none';
    if (ok){ pollChat(); clearInterval(chatTimer); chatTimer=setInterval(pollChat,4000); }
  }

  window.verifyTelegram = async function(){
    const rawInput = $('tgUser').value.trim();
    const u = rawInput.replace(/^@+/, '');
    const isAdminNow = document.body.classList.contains('is-admin');

    if (isReservedAhmedName(u) && !isAdminNow){
      toast('اسم أحمد مخصص للأدمن فقط ومينفعش حد يكتبه');
      return;
    }

    if (!/^[A-Za-z0-9_\u0621-\u064A ]{3,32}$/.test(u)) {
      toast('اكتب يوزر أو اسم صحيح (3 حروف على الأقل)');
      return;
    }

    const btn = $('verifyBtn'); btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> بنتحقق...';
    try {
      let member = true;
      if (VERIFY_URL){
        const r = await fetch(`${VERIFY_URL}?channel=${encodeURIComponent(TG_CHANNEL)}&user=${encodeURIComponent(u)}`);
        member = !!(await r.json()).member;
      }
      if (!member) { toast('لازم تشترك في القناة الأول'); return; }
      chatUser = isAdminNow ? 'أحمد' : u.trim();
      try { localStorage.setItem('tg_user', chatUser); } catch(e){}
      toast('تم التحقق ✓ أهلاً ' + chatUser);
      enterChat();
    } catch(e){ toast('تعذر التحقق، جرب تاني'); }
    finally { btn.disabled=false; btn.textContent='تحقق من الاشتراك'; }
  };

  async function pollChat(){
    try {
      const r = await fetch(`${CHAT_URL}.json?orderBy="$key"&limitToLast=50`);
      const data = await r.json(); if (!data || data.error) return;
      const list = Object.values(data);
      if (list.length === lastCount) return; lastCount = list.length;
      const box = $('chMsgs'); const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
      box.innerHTML = list.map(m=>{
        const verifiedAdmin = !!m.admin && isReservedAhmedName(m.name);
        const displayName = verifiedAdmin ? 'أحمد' : (m.name || 'مستخدم');
        const isMe = !verifiedAdmin && displayName === chatUser;
        const nameStyle = verifiedAdmin ? 'color:#38bdf8;' : `color:${userColor(displayName)};`;
        const badgeHtml = verifiedAdmin
          ? `<i class="fas fa-check-circle adm"></i><span class="adm-badge">مطور الموقع</span>`
          : '';
        return `
          <div class="msg ${verifiedAdmin ? 'admin-msg' : (isMe ? 'me' : '')}">
            <small style="${nameStyle}">${escapeHTML(displayName)}${badgeHtml}</small>
            <p>${escapeHTML(m.text)}</p>
          </div>`;
      }).join('');
      if (atEnd || lastCount<=50) box.scrollTop = box.scrollHeight;
    } catch(e){}
  }

  window.sendChat = async function(){
    const inp = $('chInput'); const text = inp.value.trim();
    if (!text || !chatUser) return;
    if (Date.now()-lastSend < 2000) { toast('استنى ثانيتين بين كل رسالة'); return; }
    lastSend = Date.now(); inp.value='';

    const isAdminNow = document.body.classList.contains('is-admin');
    const finalName = isAdminNow ? 'أحمد' : chatUser;

    try {
      await fetch(`${CHAT_URL}.json`,{method:'POST',body:JSON.stringify({
        name: finalName,
        text: text.slice(0,300),
        admin: isAdminNow,
        ts: Date.now()
      })});
      lastCount=-1; pollChat();
    } catch(e){ toast('تعذر إرسال الرسالة'); }
  };

  /* ===== عداد الزوار (كل زائر يتحسب مرة واحدة بس) ===== */
  async function sha256Hex(str){
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    } catch(e){
      let h1 = 5381, h2 = 52711;
      for (let i = 0; i < str.length; i++){ const c = str.charCodeAt(i); h1 = (h1*33) ^ c; h2 = (h2*33) ^ c; }
      return (h1>>>0).toString(16).padStart(8,'0') + (h2>>>0).toString(16).padStart(8,'0') + str.length.toString(16);
    }
  }

  async function getVisitorId(){
    let ip = null;
    try {
      const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 4000);
      const r = await fetch('https://api.ipify.org?format=json', { signal: ctl.signal });
      clearTimeout(tm);
      ip = (await r.json()).ip;
    } catch(e){}
    if (ip) return 'ip_' + (await sha256Hex('cfg-visitors|' + ip)).slice(0, 24);   // بنخزّن بصمة مش الـIP نفسه
    let dev = null;                                                                  // لو الـIP مجاش نستخدم رقم الجهاز
    try {
      dev = localStorage.getItem('vc_dev');
      if (!dev){ dev = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); localStorage.setItem('vc_dev', dev); }
    } catch(e){}
    return dev ? 'dv_' + (await sha256Hex(dev)).slice(0, 24) : null;
  }

  async function trackVisitor(){
    try { if (localStorage.getItem('vc_done')) return; } catch(e){}
    try {
      const id = await getVisitorId(); if (!id) return;
      const url = `${DB_ROOT}/visitors/${id}.json`;
      const g = await fetch(url); if (!g.ok) return;
      if ((await g.json()) === null){
        const put = await fetch(url, { method:'PUT', body: JSON.stringify({ t: { '.sv': 'timestamp' } }) });
        if (put.ok) await fetch(`${DB_ROOT}/stats/uniqueVisitors.json`, { method:'PUT', body: JSON.stringify({ '.sv': { increment: 1 } }) });
        else return;
      }
      try { localStorage.setItem('vc_done', '1'); } catch(e){}
    } catch(e){}
  }

  window.loadVisitors = async function(){
    const el = $('visCount'); el.textContent = '...';
    try {
      const r = await fetch(`${DB_ROOT}/stats/uniqueVisitors.json`);
      if (!r.ok) throw 0;
      const n = await r.json();
      el.textContent = (typeof n === 'number' ? n : 0).toLocaleString('ar-EG');
    } catch(e){ el.textContent = '—'; }
  };

  addEventListener('scroll', ()=>$('toTop').classList.toggle('show', scrollY>400), {passive:true});

  loadFiles(true);
  trackVisitor();
})();
</script>
</body>
</html>
